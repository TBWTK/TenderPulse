{% macro profile_fields(profile=none) -%}
<label class="field wide"><span>Описание деятельности</span><textarea name="description" rows="3" required>{{ profile.description if profile else '' }}</textarea><small>Что именно делает компания и для каких заказчиков.</small></label>
<label class="field"><span>Товары и услуги · по одной на строку</span><textarea name="services" rows="5" required>{{ profile.services|join('\n') if profile else '' }}</textarea></label>
<label class="field"><span>Компетенции · по одной на строку</span><textarea name="capabilities" rows="5" required>{{ profile.capabilities|join('\n') if profile else '' }}</textarea></label>
<label class="field"><span>Ключевые слова</span><textarea name="keywords" rows="4" required>{{ profile.positive_keywords|join(', ') if profile else '' }}</textarea><small>Фразы из предмета закупки: ремонт автомобилей, разработка ПО.</small></label>
<label class="field"><span>Стоп-слова</span><textarea name="negative_keywords" rows="4">{{ profile.negative_keywords|join(', ') if profile else '' }}</textarea><small>Чужие направления, которые должны снижать релевантность.</small></label>
<label class="field"><span>Классификаторы · SYSTEM: префикс, префикс</span><textarea name="classifications" rows="4" placeholder="OKPD2: 62.01&#10;CPV: 722" required>{% if profile %}{% for system, prefixes in profile.classification_prefixes.items() %}{{ system }}: {{ prefixes|join(', ') }}{% if not loop.last %}
{% endif %}{% endfor %}{% endif %}</textarea></label>
<label class="field"><span>Типы заказчиков</span><textarea name="customer_types" rows="4">{{ profile.customer_types|join('\n') if profile else '' }}</textarea></label>
{% if profile %}<label class="field"><span>Страна</span><input name="countries" value="{{ profile.countries|join(', ') }}" required readonly></label>{% else %}<input type="hidden" name="countries" value="RU">{% endif %}
<label class="field"><span>Базовый регион</span><input name="base_region" value="{{ profile.base_region or '' if profile else '' }}" placeholder="RU-MOW"><small>Домашний регион компании.</small></label>
<label class="field"><span>Регионы оказания услуг</span><input name="service_regions" value="{{ profile.service_regions|join(', ') if profile else '' }}" placeholder="RU-MOW, RU-MOS"></label>
<label class="field"><span>Формат оказания</span><select name="delivery_mode">{% for value, label in [('onsite', 'Физически на объекте'), ('remote', 'Удалённо'), ('hybrid', 'Гибридно'), ('unknown', 'Не определено')] %}<option value="{{ value }}" {{ 'selected' if profile and profile.delivery_mode.value == value else '' }}>{{ label }}</option>{% endfor %}</select></label>
<label class="field"><span>Исключённые регионы</span><input name="excluded_regions" value="{{ profile.excluded_regions|join(', ') if profile else '' }}" placeholder="RU-KAM"></label>
<fieldset class="policy-checks wide"><legend>Политика выполнения</legend><label><input type="checkbox" name="nationwide" {{ 'checked' if profile and profile.nationwide else '' }}> Работа по всей России</label><label><input type="checkbox" name="travel_allowed" {{ 'checked' if profile and profile.travel_allowed else '' }}> Командировки допустимы</label><label><input type="checkbox" name="contractors_allowed" {{ 'checked' if profile and profile.contractors_allowed else '' }}> Подрядчики допустимы</label></fieldset>
<label class="field wide"><span>Обязательные условия участия</span><textarea name="participation_constraints" rows="3">{{ profile.participation_constraints|join('\n') if profile else '' }}</textarea></label>
<div class="budget-fields wide"><label class="field"><span>Бюджет от</span><input type="number" name="min_amount" min="0" step="any" value="{{ profile.min_amount if profile and profile.min_amount is not none else '' }}"></label><label class="field"><span>Бюджет до</span><input type="number" name="max_amount" min="0" step="any" value="{{ profile.max_amount if profile and profile.max_amount is not none else '' }}"></label></div>
{%- endmacro %}
